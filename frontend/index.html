<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career-Sniper: Distributed K8s Job Engine</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background-color: #020617; /* slate-950 */
            color: #f8fafc;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
        /* Custom scrollbar for terminal feel */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        // AWS Load Balancer URL
        const API_BASE = "http://af21348f98f684821a7e07427049bbc1-1303724835.ap-south-1.elb.amazonaws.com";

        const TARGETS = [
            { name: "Hacker News Jobs", url: "https://news.ycombinator.com/jobs" },
            { name: "WeWorkRemotely (Programming)", url: "https://weworkremotely.com/categories/remote-programming-jobs.rss" },
            { name: "RemoteOK (Dev)", url: "https://remoteok.com/remote-dev-jobs.rss" }
        ];

        // --- Helper for time ago ---
        function timeAgo(dateStr) {
            if (!dateStr) return "Unknown time";
            const date = new Date(dateStr);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " years ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " months ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " hours ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " mins ago";
            return Math.floor(seconds) + " secs ago";
        }

        // --- Icons ---
        const IconActivity = () => <svg xmlns="http://www.w3.org/2005/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-activity"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.48 12H2"/></svg>;
        const IconServer = () => <svg xmlns="http://www.w3.org/2005/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-server"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>;
        const IconExternalLink = () => <svg xmlns="http://www.w3.org/2005/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-external-link inline ml-1"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>;
        const IconAlertCircle = () => <svg xmlns="http://www.w3.org/2005/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-alert-circle"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;

        function App() {
            const [selectedTarget, setSelectedTarget] = useState(TARGETS[0].url);
            const [status, setStatus] = useState("IDLE"); // IDLE, PROCESSING, ERROR
            const [errorMsg, setErrorMsg] = useState("");
            const [jobs, setJobs] = useState([]);
            const [logs, setLogs] = useState([{ time: new Date().toLocaleTimeString(), text: "System initialized. Ready for task queueing." }]);
            const [pollCount, setPollCount] = useState(0);
            
            const logsEndRef = useRef(null);

            const addLog = (text) => {
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), text }]);
            };

            // Auto-scroll logs
            useEffect(() => {
                logsEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [logs]);

            const handleQueueTask = async () => {
                setStatus("PROCESSING");
                setErrorMsg("");
                setPollCount(0);
                addLog(`Initiating job sniper for: ${selectedTarget}`);

                try {
                    const response = await fetch(`${API_BASE}/track`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: selectedTarget })
                    });
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const data = await response.json();
                    addLog(`Success: ${data.status}. Kafka processing started.`);
                    startPolling();
                } catch (err) {
                    setStatus("ERROR");
                    setErrorMsg(`Network failure: ${err.message}. Ensure backend is reachable.`);
                    addLog(`ERROR: POST /track failed - ${err.message}`);
                }
            };

            const startPolling = () => {
                const interval = setInterval(async () => {
                    setPollCount(p => p + 1);
                    addLog(`Polling GET /history...`);
                    
                    try {
                        const response = await fetch(`${API_BASE}/history?limit=30`);
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        
                        const data = await response.json();
                        
                        if (data && data.length > 0) {
                            addLog(`Received ${data.length} jobs from data vault.`);
                            // In a real app we'd filter by the exact job, but here we just take the latest
                            setJobs(data);
                            setStatus("IDLE");
                            clearInterval(interval);
                        } else {
                            addLog("No new data yet. Worker still processing...");
                        }
                    } catch (err) {
                        addLog(`ERROR: GET /history failed - ${err.message}`);
                        // Don't stop polling on transient error, but maybe limit retries
                    }
                }, 3000);

                // Timeout after 60s
                setTimeout(() => {
                    clearInterval(interval);
                    if (status === "PROCESSING") {
                        setStatus("ERROR");
                        setErrorMsg("Polling timed out. Worker may be stuck.");
                        addLog("ERROR: Polling timeout reached.");
                    }
                }, 60000);
            };

            return (
                <div className="max-w-6xl mx-auto p-6 md:p-10 font-mono">
                    {/* Header */}
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 border-b border-slate-800 pb-6">
                        <div>
                            <h1 className="text-3xl font-bold tracking-tight text-white flex items-center gap-3">
                                <IconActivity />
                                Career-Sniper
                            </h1>
                            <p className="text-slate-400 mt-2 text-sm uppercase tracking-widest">Distributed K8s Job Engine</p>
                        </div>
                        <div className="mt-4 md:mt-0 flex items-center gap-3 bg-slate-900 border border-slate-800 py-2 px-4 rounded-full">
                            <span className="relative flex h-3 w-3">
                              <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                              <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                            </span>
                            <span className="text-sm text-emerald-400 font-medium">Kafka Broker: Online</span>
                        </div>
                    </header>

                    {/* Main Control Panel */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
                        <div className="col-span-1 lg:col-span-2 bg-slate-900 rounded-xl border border-slate-800 p-6 shadow-2xl">
                            <h2 className="text-xl font-semibold mb-6 flex items-center gap-2 text-cyan-400">
                                <IconServer />
                                Control Panel
                            </h2>
                            
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm text-slate-400 mb-2">Target Data Source</label>
                                    <div className="relative">
                                        <select 
                                            value={selectedTarget}
                                            onChange={(e) => setSelectedTarget(e.target.value)}
                                            disabled={status === "PROCESSING"}
                                            className="w-full appearance-none bg-slate-950 border border-slate-700 text-white rounded-lg py-3 px-4 leading-tight focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 disabled:opacity-50 transition-colors"
                                        >
                                            {TARGETS.map(t => (
                                                <option key={t.url} value={t.url}>{t.name}</option>
                                            ))}
                                        </select>
                                        <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                                            <svg className="fill-current h-4 w-4" xmlns="http://www.w3.org/2005/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                                        </div>
                                    </div>
                                </div>

                                <button 
                                    onClick={handleQueueTask}
                                    disabled={status === "PROCESSING"}
                                    className={`w-full py-4 rounded-lg font-bold tracking-wide transition-all duration-300 shadow-lg flex items-center justify-center gap-2
                                        ${status === "PROCESSING" 
                                            ? "bg-slate-800 text-cyan-400 border border-cyan-800/50 cursor-not-allowed shadow-[0_0_15px_rgba(34,211,238,0.2)]" 
                                            : "bg-cyan-600 hover:bg-cyan-500 text-white border border-cyan-400/30 hover:shadow-[0_0_20px_rgba(34,211,238,0.4)]"}`}
                                >
                                    {status === "PROCESSING" ? (
                                        <>
                                            <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-cyan-400" xmlns="http://www.w3.org/2005/svg" fill="none" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                            </svg>
                                            Kafka Processing...
                                        </>
                                    ) : "Queue Scraping Task"}
                                </button>
                                
                                <AnimatePresence>
                                    {errorMsg && (
                                        <motion.div 
                                            initial={{ opacity: 0, y: -10 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            exit={{ opacity: 0, y: -10 }}
                                            className="bg-red-950/50 border border-red-900/50 rounded-lg p-4 text-red-400 text-sm flex items-start gap-3"
                                        >
                                            <IconAlertCircle />
                                            <p>{errorMsg}</p>
                                        </motion.div>
                                    )}
                                </AnimatePresence>
                            </div>
                        </div>

                        {/* Terminal Log */}
                        <div className="col-span-1 bg-[#0a0a0a] rounded-xl border border-slate-800 p-4 shadow-inner flex flex-col h-80 lg:h-auto">
                            <div className="text-xs text-slate-500 mb-2 border-b border-slate-800 pb-2 uppercase tracking-widest">System Output</div>
                            <div className="flex-1 overflow-y-auto text-xs text-slate-300 font-mono space-y-1 pr-2">
                                {logs.map((log, i) => (
                                    <div key={i} className="flex gap-3">
                                        <span className="text-slate-600 shrink-0">[{log.time}]</span>
                                        <span className={log.text.includes("ERROR") ? "text-red-400" : log.text.includes("Success") ? "text-emerald-400" : "text-cyan-200"}>{log.text}</span>
                                    </div>
                                ))}
                                <div ref={logsEndRef} />
                            </div>
                        </div>
                    </div>

                    {/* Data Vault */}
                    <div>
                        <h2 className="text-2xl font-bold mb-6 text-slate-200 border-b border-slate-800 pb-4">Live Data Vault</h2>
                        
                        {jobs.length === 0 ? (
                            <div className="text-center py-20 text-slate-500 border border-dashed border-slate-800 rounded-xl">
                                <IconServer className="mx-auto h-12 w-12 text-slate-700 mb-3" />
                                <p>No data retrieved yet. Queue a task to populate the vault.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                <AnimatePresence>
                                    {jobs.map((job, index) => (
                                        <motion.div
                                            key={`${job.link}-${index}`}
                                            initial={{ opacity: 0, y: 20 }}
                                            animate={{ opacity: 1, y: 0 }}
                                            transition={{ duration: 0.4, delay: index * 0.05 }}
                                            className="bg-slate-900 border border-slate-800 hover:border-cyan-500/50 rounded-xl p-6 transition-all duration-300 group hover:shadow-[0_4px_20px_rgba(34,211,238,0.1)] flex flex-col justify-between"
                                        >
                                            <div>
                                                <div className="flex justify-between items-start mb-4">
                                                    <span className="px-3 py-1 bg-slate-800 text-cyan-400 rounded-full text-xs font-semibold border border-slate-700">
                                                        {job.source}
                                                    </span>
                                                    <span className="text-xs text-slate-500 flex items-center gap-1">
                                                        {timeAgo(job.scraped_at)}
                                                    </span>
                                                </div>
                                                <a href={job.link} target="_blank" rel="noopener noreferrer" className="block text-lg font-bold text-slate-100 group-hover:text-cyan-300 transition-colors mb-4 line-clamp-3 leading-snug">
                                                    {job.title}
                                                    <IconExternalLink />
                                                </a>
                                            </div>
                                        </motion.div>
                                    ))}
                                </AnimatePresence>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
