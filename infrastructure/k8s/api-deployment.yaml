apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scraper-combined
  template:
    metadata:
      labels:
        app: scraper-combined
    spec:
      containers:
      - name: api-container
        image: mithilesh321/scraper-api:latest
        resources: # <-- ADD THIS: Keeps the pod from eating all node RAM
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
        ports:
        - containerPort: 8000
        env:
        # FIXED: Changed from KAFKA_BROKER to KAFKA_BOOTSTRAP_SERVERS
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "192.168.69.175:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: LoadBalancer
  selector:
    app: scraper-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000