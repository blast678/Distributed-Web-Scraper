apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
spec:
  replicas: 3 # Scaling up to 3 worker nodes
  selector:
    matchLabels:
      app: scraper-worker
  template:
    metadata:
      labels:
        app: scraper-worker
    spec:
      containers:
      - name: worker-container
        image: mithilesh321/scraper-worker:latest
        env:
        - name: KAFKA_BROKER
          value: "kafka-service:9092"
        - name: POSTGRES_HOST
          value: "postgres-service"
        - name: POSTGRES_DB
          value: "scraper_db"
        - name: POSTGRES_USER
          value: "scraper_user"
        - name: POSTGRES_PASSWORD
          value: "scraper_password"
        - name: SCRAPERAPI_KEY
          valueFrom:
            secretKeyRef:
              name: proxy-creds
              key: api_key