apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
spec:
  replicas: 1 # Scaling up to 3 worker nodes
  selector:
    matchLabels:
      app: scraper-worker
  template:
    metadata:
      labels:
        app: scraper-worker
    spec:
      containers:
      - name: worker-container
        image: mithilesh321/scraper-worker:latest
        resources: # <-- ADD THIS
          requests:
            memory: "128Mi"
          limits:
            memory: "256Mi"
        env:
        - name: KAFKA_BROKER
          value: "192.168.69.175:9092"
        - name: POSTGRES_HOST
          value: "192.168.11.17"
        - name: POSTGRES_DB
          value: "scraper_db"
        - name: POSTGRES_USER
          value: "scraper_user"
        - name: POSTGRES_PASSWORD
          value: "scraper_password"
        - name: SCRAPERAPI_KEY
          valueFrom:
            secretKeyRef:
              name: proxy-creds
              key: api_key